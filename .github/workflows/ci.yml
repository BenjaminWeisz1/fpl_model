name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      # The repository holds no data (data/ is ignored), so tests that read data/current skip here;
      # the full suite runs locally with the data.
      - name: Test
        run: python -m pytest
